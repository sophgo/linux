%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sophgo,cv1800b-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sophgo CV1800B I2S/TDM controller

maintainers:
  - Anton D. Stavinskii <stavinsky@gmail.com>

description: |
  I2S/TDM controller found in CV1800B / Sophgo SG2002/SG2000 SoCs.

properties:
  compatible:
    const: sophgo,cv1800b-i2s

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    items:
      - const: i2s
      - const: mclk

  dmas:
    maxItems: 2

  dma-names:
    description: |
      Names of DMA channels. May be omitted. If present, one entry
      selects a single direction, while two entries select RX and TX.
    minItems: 1
    maxItems: 2
    items:
      enum: [rx, tx]

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>

    i2s1: i2s@4110000 {
        compatible = "sophgo,cv1800b-i2s";
        reg = <0x04110000 0x10000>;
        #address-cells = <1>;
        #size-cells = <0>;
        clocks = <&clk CLK_APB_I2S1>,  <&clk CLK_SDMA_AUD1>;
        clock-names = "i2s", "mclk";
        dmas = <&dmamux 2 1>, <&dmamux 3 1>;
        dma-names = "rx", "tx";
    };
...
